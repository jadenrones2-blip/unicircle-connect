<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <title>The Casting Call</title>
  <rect width="1080" height="1080" fill="#0A0A0A"/>

  <!-- Top label -->
  <text x="80" y="100" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#C9A84C" letter-spacing="5">ACTIVELY RECRUITING NOW.</text>
  <rect x="80" y="116" width="60" height="2" fill="#C9A84C"/>

  <!-- Job posting rows -->

  <!-- Row 1 -->
  <rect x="80" y="148" width="920" height="110" rx="8" fill="#111111"/>
  <rect x="80" y="148" width="3" height="110" rx="2" fill="#C9A84C"/>
  <text x="108" y="196" font-family="'Arial Black', Arial, sans-serif" font-size="30" font-weight="900" fill="#ffffff" letter-spacing="-1">Rady Venture Capital Fund</text>
  <text x="108" y="226" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#555">Looking for driven students interested in venture + startups.</text>
  <text x="968" y="196" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#C9A84C" text-anchor="end" letter-spacing="2">OPEN</text>

  <!-- Row 2 -->
  <rect x="80" y="276" width="920" height="110" rx="8" fill="#111111"/>
  <rect x="80" y="276" width="3" height="110" rx="2" fill="#C9A84C"/>
  <text x="108" y="324" font-family="'Arial Black', Arial, sans-serif" font-size="30" font-weight="900" fill="#ffffff" letter-spacing="-1">UCSD Pre-Law Society</text>
  <text x="108" y="354" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#555">Seeking ambitious students with interest in law + advocacy.</text>
  <text x="968" y="324" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#C9A84C" text-anchor="end" letter-spacing="2">OPEN</text>

  <!-- Row 3 -->
  <rect x="80" y="404" width="920" height="110" rx="8" fill="#111111"/>
  <rect x="80" y="404" width="3" height="110" rx="2" fill="#C9A84C"/>
  <text x="108" y="452" font-family="'Arial Black', Arial, sans-serif" font-size="30" font-weight="900" fill="#ffffff" letter-spacing="-1">Triton Consulting Group</text>
  <text x="108" y="482" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#555">Recruiting analysts for real client work this quarter.</text>
  <text x="968" y="452" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#C9A84C" text-anchor="end" letter-spacing="2">OPEN</text>

  <!-- Row 4 — faded more listings -->
  <rect x="80" y="532" width="920" height="70" rx="8" fill="#0d0d0d"/>
  <text x="108" y="574" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#2a2a2a">+ 597 more organizations recruiting this quarter...</text>

  <!-- Divider -->
  <rect x="80" y="630" width="920" height="1" fill="#ffffff" opacity="0.06"/>

  <!-- The question -->
  <text x="80" y="750" font-family="'Arial Black', Arial, sans-serif" font-size="90" font-weight="900" fill="#ffffff" letter-spacing="-3">Do they know</text>
  <text x="80" y="855" font-family="'Arial Black', Arial, sans-serif" font-size="90" font-weight="900" fill="#C9A84C" letter-spacing="-3">you exist?</text>

  <text x="80" y="960" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#555">Find every club recruiting right now at UCSD.</text>

  <text x="80" y="1020" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#C9A84C" letter-spacing="2">unicircle.app</text>
</svg>
