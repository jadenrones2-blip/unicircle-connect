<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <title>The Side-by-Side</title>
  <rect width="1080" height="1080" fill="#0A0A0A"/>

  <!-- Left half tint -->
  <rect x="0" y="0" width="540" height="1080" fill="#ef4444" fill-opacity="0.04"/>
  <!-- Right half tint -->
  <rect x="540" y="0" width="540" height="1080" fill="#C9A84C" fill-opacity="0.04"/>

  <!-- Center divider -->
  <rect x="538" y="0" width="4" height="1080" fill="#ffffff" opacity="0.06"/>

  <!-- Slide number -->
  <text x="48" y="88" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#C9A84C" letter-spacing="4">03 / 05</text>

  <!-- Column headers -->
  <rect x="0" y="108" width="540" height="72" fill="#ef4444" fill-opacity="0.12"/>
  <text x="270" y="154" font-family="'Arial Black', Arial, sans-serif" font-size="18" font-weight="900" fill="#ef4444" text-anchor="middle" letter-spacing="3">WITHOUT UNICIRCLE</text>

  <rect x="540" y="108" width="540" height="72" fill="#C9A84C" fill-opacity="0.12"/>
  <text x="810" y="154" font-family="'Arial Black', Arial, sans-serif" font-size="18" font-weight="900" fill="#C9A84C" text-anchor="middle" letter-spacing="3">WITH UNICIRCLE</text>

  <!-- Row 1 -->
  <rect x="0" y="180" width="540" height="1" fill="#ffffff" opacity="0.05"/>
  <text x="48" y="242" font-family="'Arial Black', Arial, sans-serif" font-size="24" font-weight="900" fill="#ef4444" letter-spacing="-0.5">New form every quarter</text>
  <text x="48" y="272" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#555">Rebuilt from scratch. Every time.</text>
  <rect x="0" y="295" width="536" height="1" fill="#ffffff" opacity="0.05"/>

  <text x="564" y="242" font-family="'Arial Black', Arial, sans-serif" font-size="24" font-weight="900" fill="#C9A84C" letter-spacing="-0.5">Pipeline saves every cycle</text>
  <text x="564" y="272" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#555">Set up once. Carries forward forever.</text>
  <rect x="544" y="295" width="536" height="1" fill="#ffffff" opacity="0.05"/>

  <!-- Row 2 -->
  <text x="48" y="357" font-family="'Arial Black', Arial, sans-serif" font-size="24" font-weight="900" fill="#ef4444" letter-spacing="-0.5">Scoring in a group chat</text>
  <text x="48" y="387" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#555">6 opinions. Zero structure. Chaos.</text>
  <rect x="0" y="410" width="536" height="1" fill="#ffffff" opacity="0.05"/>

  <text x="564" y="357" font-family="'Arial Black', Arial, sans-serif" font-size="24" font-weight="900" fill="#C9A84C" letter-spacing="-0.5">Per-officer rubric scoring</text>
  <text x="564" y="387" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#555">Weighted totals. Clear decisions.</text>
  <rect x="544" y="410" width="536" height="1" fill="#ffffff" opacity="0.05"/>

  <!-- Row 3 -->
  <text x="48" y="472" font-family="'Arial Black', Arial, sans-serif" font-size="24" font-weight="900" fill="#ef4444" letter-spacing="-0.5">Sign-in sheet mystery</text>
  <text x="48" y="502" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#555">80 names. No match to apps.</text>
  <rect x="0" y="525" width="536" height="1" fill="#ffffff" opacity="0.05"/>

  <text x="564" y="472" font-family="'Arial Black', Arial, sans-serif" font-size="24" font-weight="900" fill="#C9A84C" letter-spacing="-0.5">Event attendance tracked</text>
  <text x="564" y="502" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#555">Matched to applicants instantly.</text>
  <rect x="544" y="525" width="536" height="1" fill="#ffffff" opacity="0.05"/>

  <!-- Row 4 -->
  <text x="48" y="587" font-family="'Arial Black', Arial, sans-serif" font-size="24" font-weight="900" fill="#ef4444" letter-spacing="-0.5">Manual applicant emails</text>
  <text x="48" y="617" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#555">Copy. Paste. Send. Repeat 300x.</text>
  <rect x="0" y="640" width="536" height="1" fill="#ffffff" opacity="0.05"/>

  <text x="564" y="587" font-family="'Arial Black', Arial, sans-serif" font-size="24" font-weight="900" fill="#C9A84C" letter-spacing="-0.5">Emails fire automatically</text>
  <text x="564" y="617" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#555">Every stage change. Zero manual work.</text>
  <rect x="544" y="640" width="536" height="1" fill="#ffffff" opacity="0.05"/>

  <!-- Row 5 -->
  <text x="48" y="702" font-family="'Arial Black', Arial, sans-serif" font-size="24" font-weight="900" fill="#ef4444" letter-spacing="-0.5">33 hrs lost every quarter</text>
  <text x="48" y="732" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#555">Same officers. Same mistakes.</text>
  <rect x="0" y="755" width="536" height="1" fill="#ffffff" opacity="0.05"/>

  <text x="564" y="702" font-family="'Arial Black', Arial, sans-serif" font-size="24" font-weight="900" fill="#C9A84C" letter-spacing="-0.5">33 hrs back every quarter</text>
  <text x="564" y="732" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#555">Spent on actually running your org.</text>
  <rect x="544" y="755" width="536" height="1" fill="#ffffff" opacity="0.05"/>

  <!-- Bottom summary -->
  <rect x="0" y="800" width="1080" height="200" fill="#111111"/>
  <text x="540" y="870" font-family="'Arial Black', Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">Same 10-week quarter.</text>
  <text x="540" y="938" font-family="'Arial Black', Arial, sans-serif" font-size="52" font-weight="900" fill="#C9A84C" text-anchor="middle" letter-spacing="-2">Very different outcome.</text>

  <text x="540" y="1048" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#C9A84C" letter-spacing="3" opacity="0.4" text-anchor="middle">UNICIRCLE</text>
</svg>
