  <text x="766" y="343" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">LOST APPLICANT · 88%</text>

  <!-- DETECTION BOX 7 — bottom center -->
  <rect x="350" y="620" width="220" height="160" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
  <rect x="350" y="607" width="220" height="22" fill="#C9A84C"/>
