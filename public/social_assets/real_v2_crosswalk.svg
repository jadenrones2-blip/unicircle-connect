  <!-- Bottom text -->
  <text x="60" y="910" font-family="'Arial Black', Arial, sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-2">This is what we</text>
  <text x="60" y="976" font-family="'Arial Black', Arial, sans-serif" font-size="54" font-weight="900" fill="#C9A84C" letter-spacing="-2">came to fix.</text>

  <text x="1020" y="1040" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#C9A84C" text-anchor="end" letter-spacing="1">unicircle.app</text>
