<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <title>UniCircle — Hard Truth: We Run 300-Person Recruitment With a Group Chat</title>
  <desc>UniCircle social asset: Raw founder confession about how club recruitment actually works and what it costs clubs.</desc>

  <defs>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C9A84C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8C96B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1c1c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111111;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#0A0A0A"/>

  <!-- Subtle horizontal lines (notebook feel) -->
  <defs>
    <pattern id="lines" width="1080" height="48" patternUnits="userSpaceOnUse">
      <line x1="0" y1="47" x2="1080" y2="47" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1080" height="1080" fill="url(#lines)"/>

  <!-- Gold bar top -->
  <rect x="0" y="0" width="1080" height="5" fill="url(#goldGrad3)"/>

  <!-- "HARD TRUTH" stamp/eyebrow -->
  <rect x="80" y="60" width="220" height="48" rx="8" fill="#C9A84C" fill-opacity="0.15" stroke="#C9A84C" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="190" y="91" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#C9A84C" text-anchor="middle" letter-spacing="3">HARD TRUTH</text>

  <!-- Main quote block — like a screenshot/message -->
  <rect x="80" y="148" width="920" height="420" rx="20" fill="url(#cardBg)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Quote mark decorative -->
  <text x="112" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="120" fill="#C9A84C" opacity="0.25">"</text>

  <!-- The confession text -->
  <text x="112" y="266" font-family="'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff">We run 300-person</text>
  <text x="112" y="324" font-family="'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff">recruitment with</text>
  <text x="112" y="382" font-family="'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="900" fill="#C9A84C">a group chat</text>
  <text x="112" y="440" font-family="'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff">and a Google Doc.</text>

  <!-- Attribution line inside card -->
  <rect x="112" y="504" width="856" height="1" fill="#ffffff" opacity="0.08"/>
  <text x="112" y="535" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#71717a">— Every club president I talked to at UCSD</text>

  <!-- Follow-up statement -->
  <text x="80" y="634" font-family="'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="900" fill="#ffffff">Nobody had to.</text>

  <!-- Three pain points as a quick list -->
  <!-- Item 1 -->
  <circle cx="104" cy="708" r="8" fill="#C9A84C" fill-opacity="0.2" stroke="#C9A84C" stroke-width="1.5"/>
  <text x="118" y="714" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="#C9A84C" text-anchor="middle">✕</text>
  <text x="132" y="718" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500" fill="#a1a1aa">Officer feedback buried in DMs</text>

  <!-- Item 2 -->
  <circle cx="104" cy="768" r="8" fill="#C9A84C" fill-opacity="0.2" stroke="#C9A84C" stroke-width="1.5"/>
  <text x="118" y="774" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="#C9A84C" text-anchor="middle">✕</text>
  <text x="132" y="778" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500" fill="#a1a1aa">Starting from scratch every semester</text>

  <!-- Item 3 -->
  <circle cx="104" cy="828" r="8" fill="#C9A84C" fill-opacity="0.2" stroke="#C9A84C" stroke-width="1.5"/>
  <text x="118" y="834" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="#C9A84C" text-anchor="middle">✕</text>
  <text x="132" y="838" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500" fill="#a1a1aa">Losing great applicants to chaos</text>

  <!-- CTA block -->
  <rect x="80" y="906" width="920" height="100" rx="16" fill="#C9A84C" fill-opacity="0.08" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.3"/>
  <text x="540" y="950" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="#C9A84C" text-anchor="middle">There's a pipeline built for this.</text>
  <text x="540" y="986" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#ffffff" text-anchor="middle" opacity="0.7">unicircle.app — free to start</text>
</svg>
