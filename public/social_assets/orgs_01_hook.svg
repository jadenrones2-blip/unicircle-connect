<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <title>Orgs Carousel — Slide 1 Hook</title>
  <rect width="1080" height="1080" fill="#0A0A0A"/>

  <!-- Right edge swipe hint -->
  <rect x="1050" y="0" width="30" height="1080" fill="#C9A84C" fill-opacity="0.06"/>
  <text x="1068" y="548" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#C9A84C" fill-opacity="0.4" text-anchor="middle" transform="rotate(90,1068,548)" letter-spacing="3">SWIPE</text>

  <!-- Slide number -->
  <text x="80" y="88" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#C9A84C" letter-spacing="4">01 / 05</text>

  <!-- Eyebrow -->
  <text x="80" y="200" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#C9A84C" letter-spacing="5">FOR CLUB LEADERS.</text>
  <rect x="80" y="214" width="60" height="2" fill="#C9A84C"/>

  <!-- Main headline -->
  <text x="80" y="370" font-family="'Arial Black', Arial, sans-serif" font-size="120" font-weight="900" fill="#ffffff" letter-spacing="-5">10 weeks.</text>
  <text x="80" y="500" font-family="'Arial Black', Arial, sans-serif" font-size="120" font-weight="900" fill="#ffffff" letter-spacing="-5">300 apps.</text>

  <!-- Divider -->
  <rect x="80" y="540" width="920" height="1" fill="#ffffff" opacity="0.07"/>

  <!-- The gut punch -->
  <text x="80" y="660" font-family="'Arial Black', Arial, sans-serif" font-size="100" font-weight="900" fill="#C9A84C" letter-spacing="-4">How much</text>
  <text x="80" y="768" font-family="'Arial Black', Arial, sans-serif" font-size="100" font-weight="900" fill="#C9A84C" letter-spacing="-4">of it is just</text>
  <text x="80" y="876" font-family="'Arial Black', Arial, sans-serif" font-size="100" font-weight="900" fill="#C9A84C" letter-spacing="-4">spreadsheets?</text>

  <text x="80" y="980" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#555">Swipe to see where the hours actually go.</text>

  <text x="80" y="1048" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#C9A84C" letter-spacing="2" opacity="0.5">UNICIRCLE</text>
</svg>
