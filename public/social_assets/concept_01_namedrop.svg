  <text x="80" y="810" font-family="'Arial Black', Arial, sans-serif" font-size="90" font-weight="900" fill="#C9A84C" letter-spacing="-3">the other 597.</text>

  <!-- Bottom -->
  <text x="80" y="1020" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#C9A84C" letter-spacing="2">unicircle.app</text>
