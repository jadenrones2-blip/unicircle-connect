<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <title>Carousel Slide 4 — Founder Story</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="100%" style="stop-color:#0f0f0f"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161618"/>
      <stop offset="100%" style="stop-color:#111113"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Swipe hint -->
  <rect x="1040" y="0" width="40" height="1080" fill="#C9A84C" fill-opacity="0.08"/>
  <text x="1068" y="548" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#C9A84C" fill-opacity="0.5" text-anchor="middle" transform="rotate(90,1068,548)" letter-spacing="3">SWIPE →</text>

  <!-- Slide number -->
  <text x="72" y="80" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#C9A84C" letter-spacing="4">04 / 05</text>

  <!-- Label -->
  <text x="72" y="180" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#C9A84C" letter-spacing="3">WHY WE BUILT THIS</text>
  <rect x="72" y="192" width="220" height="2" fill="#C9A84C" opacity="0.5"/>

  <!-- Headline -->
  <text x="72" y="295" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="900" fill="#ffffff" letter-spacing="-2">I transferred to</text>
  <text x="72" y="371" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="900" fill="#C9A84C" letter-spacing="-2">UCSD not knowing</text>
  <text x="72" y="447" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="900" fill="#ffffff" letter-spacing="-2">a single person.</text>

  <!-- Quote card -->
  <rect x="72" y="496" width="936" height="230" rx="20" fill="url(#cardBg)" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.2"/>
  <text x="100" y="590" font-family="Georgia, serif" font-size="100" fill="#C9A84C" opacity="0.2">"</text>
  <text x="152" y="570" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#ffffff" font-style="italic">I Googled "UCSD clubs." Got a messy</text>
  <text x="152" y="606" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#ffffff" font-style="italic">website and scattered Instagram pages,</text>
  <text x="152" y="642" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#ffffff" font-style="italic">some not updated since 2022.</text>
  <text x="152" y="694" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#C9A84C">— Jaden Rones, Founder · UCSD Transfer Student</text>

  <!-- What came of it -->
  <text x="72" y="780" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#ffffff">Clubs are where I found my people.</text>
  <text x="72" y="820" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#71717a">They can be for you too — if you can actually find them.</text>

  <!-- Stats row -->
  <rect x="72" y="860" width="284" height="116" rx="16" fill="#161618"/>
  <text x="214" y="924" font-family="'Arial Black', Arial, sans-serif" font-size="48" font-weight="900" fill="#C9A84C" text-anchor="middle">600+</text>
  <text x="214" y="954" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#71717a" text-anchor="middle">clubs at UCSD</text>

  <rect x="390" y="860" width="284" height="116" rx="16" fill="#161618"/>
  <text x="532" y="924" font-family="'Arial Black', Arial, sans-serif" font-size="48" font-weight="900" fill="#C9A84C" text-anchor="middle">2</text>
  <text x="532" y="954" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#71717a" text-anchor="middle">campuses: UCSD + SDSU</text>

  <rect x="708" y="860" width="300" height="116" rx="16" fill="#161618"/>
  <text x="858" y="924" font-family="'Arial Black', Arial, sans-serif" font-size="48" font-weight="900" fill="#C9A84C" text-anchor="middle">Free</text>
  <text x="858" y="954" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#71717a" text-anchor="middle">always free for students</text>

  <text x="72" y="1040" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff" opacity="0.3" letter-spacing="2">UNICIRCLE</text>
</svg>
