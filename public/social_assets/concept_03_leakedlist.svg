  <rect x="160" y="518" width="460" height="28" fill="#1a1a1a" rx="2"/>
  <rect x="80" y="550" width="920" height="1" fill="#ffffff" opacity="0.05"/>

  <text x="100" y="590" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#555" letter-spacing="2">008</text>
  <rect x="160" y="568" width="400" height="28" fill="#1a1a1a" rx="2"/>
  <rect x="80" y="600" width="920" height="1" fill="#ffffff" opacity="0.05"/>

  <text x="100" y="640" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#555" letter-spacing="2">009</text>
  <rect x="160" y="618" width="540" height="28" fill="#1a1a1a" rx="2"/>
  <rect x="80" y="650" width="920" height="1" fill="#ffffff" opacity="0.05"/>

