<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <title>The Leaked List</title>
  <rect width="1080" height="1080" fill="#0A0A0A"/>

  <!-- Document border -->
  <rect x="60" y="60" width="960" height="960" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Document header -->
  <text x="540" y="140" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" opacity="0.3" text-anchor="middle" letter-spacing="5">UCSD STUDENT ORGANIZATION DIRECTORY</text>
  <rect x="80" y="155" width="920" height="1" fill="#ffffff" opacity="0.08"/>

  <!-- CONFIDENTIAL stamp — rotated -->
  <g transform="translate(820, 220) rotate(-18)">
    <rect x="-120" y="-34" width="240" height="64" fill="none" stroke="#C9A84C" stroke-width="3" rx="4"/>
    <text x="0" y="8" font-family="'Arial Black', Arial, sans-serif" font-size="32" font-weight="900" fill="#C9A84C" text-anchor="middle" letter-spacing="3" opacity="0.9">CONFIDENTIAL</text>
  </g>

  <!-- List rows -->
  <!-- Row 1 — visible -->
  <text x="100" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#555" letter-spacing="2">001</text>
  <text x="160" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Alpha Kappa Psi</text>
  <text x="900" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#C9A84C" text-anchor="end">RECRUITING</text>
  <rect x="80" y="250" width="920" height="1" fill="#ffffff" opacity="0.05"/>

  <!-- Row 2 — visible -->
  <text x="100" y="290" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#555" letter-spacing="2">002</text>
  <text x="160" y="290" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Mock Trial</text>
  <text x="900" y="290" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#555" text-anchor="end">CLOSED</text>
  <rect x="80" y="300" width="920" height="1" fill="#ffffff" opacity="0.05"/>

  <!-- Rows 3–12 — redacted -->
  <text x="100" y="340" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#555" letter-spacing="2">003</text>
  <rect x="160" y="318" width="480" height="28" fill="#1a1a1a" rx="2"/>
  <rect x="80" y="350" width="920" height="1" fill="#ffffff" opacity="0.05"/>

  <text x="100" y="390" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#555" letter-spacing="2">004</text>
  <rect x="160" y="368" width="380" height="28" fill="#1a1a1a" rx="2"/>
  <rect x="80" y="400" width="920" height="1" fill="#ffffff" opacity="0.05"/>

  <text x="100" y="440" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#555" letter-spacing="2">005</text>
  <rect x="160" y="418" width="520" height="28" fill="#1a1a1a" rx="2"/>
  <rect x="80" y="450" width="920" height="1" fill="#ffffff" opacity="0.05"/>

