<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <title>Carousel Slide 1 — Hook</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="100%" style="stop-color:#0f0f0f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C9A84C"/>
      <stop offset="100%" style="stop-color:#E8C96B"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Right edge swipe hint -->
  <rect x="1040" y="0" width="40" height="1080" fill="#C9A84C" fill-opacity="0.08"/>
  <text x="1068" y="548" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#C9A84C" fill-opacity="0.5" text-anchor="middle" transform="rotate(90,1068,548)" letter-spacing="3">SWIPE →</text>

  <!-- Slide number -->
  <text x="72" y="80" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#C9A84C" letter-spacing="4">01 / 05</text>

  <!-- Eyebrow -->
  <text x="72" y="320" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#C9A84C" letter-spacing="3">FOR UCSD STUDENTS.</text>

  <!-- Main headline -->
  <text x="72" y="460" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="108" font-weight="900" fill="#ffffff" letter-spacing="-4">600 clubs</text>
  <text x="72" y="570" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="108" font-weight="900" fill="#ffffff" letter-spacing="-4">at UCSD.</text>

  <!-- Gold divider -->
  <rect x="72" y="605" width="200" height="3" fill="#C9A84C" opacity="0.6"/>

  <text x="72" y="700" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="80" font-weight="900" fill="#C9A84C" letter-spacing="-3">You've heard</text>
  <text x="72" y="790" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="80" font-weight="900" fill="#C9A84C" letter-spacing="-3">of maybe 10.</text>

  <!-- Subtext -->
  <text x="72" y="900" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#555">Swipe to see what finding your people actually looks like.</text>

  <!-- UniCircle wordmark bottom -->
  <text x="72" y="1040" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff" opacity="0.3" letter-spacing="2">UNICIRCLE</text>
</svg>
