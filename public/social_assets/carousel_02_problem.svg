<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <title>Carousel Slide 2 — The Student Problem</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="100%" style="stop-color:#0f0f0f"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Swipe hint -->
  <rect x="1040" y="0" width="40" height="1080" fill="#C9A84C" fill-opacity="0.08"/>
  <text x="1068" y="548" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#C9A84C" fill-opacity="0.5" text-anchor="middle" transform="rotate(90,1068,548)" letter-spacing="3">SWIPE →</text>

  <!-- Slide number -->
  <text x="72" y="80" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#C9A84C" letter-spacing="4">02 / 05</text>

  <!-- Label -->
  <text x="72" y="180" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#ef4444" letter-spacing="3">WHAT IT'S LIKE RIGHT NOW</text>
  <rect x="72" y="192" width="280" height="2" fill="#ef4444" opacity="0.5"/>

  <!-- Header -->
  <text x="72" y="290" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-3">You find a club</text>
  <text x="72" y="368" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="900" fill="#ef4444" letter-spacing="-3">you're actually into.</text>
  <text x="72" y="446" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-3">Then this happens.</text>

  <!-- Steps — the painful funnel -->
  <rect x="72" y="490" width="936" height="90" rx="14" fill="#18181b"/>
  <rect x="72" y="490" width="4" height="90" rx="2" fill="#ef4444"/>
  <text x="102" y="534" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Their Instagram: last post 43 weeks ago</text>
  <text x="102" y="562" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#555">Is this club even still active?</text>

  <rect x="72" y="594" width="936" height="90" rx="14" fill="#18181b"/>
  <rect x="72" y="594" width="4" height="90" rx="2" fill="#ef4444"/>
  <text x="102" y="638" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Found a Google Form. From last spring.</text>
  <text x="102" y="666" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#555">Are they recruiting now? No idea.</text>

  <rect x="72" y="698" width="936" height="90" rx="14" fill="#18181b"/>
  <rect x="72" y="698" width="4" height="90" rx="2" fill="#ef4444"/>
  <text x="102" y="742" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">You submit anyway. Wait 3 weeks.</text>
  <text x="102" y="770" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#555">Crickets. No confirmation. Nothing.</text>

  <rect x="72" y="802" width="936" height="90" rx="14" fill="#18181b"/>
  <rect x="72" y="802" width="4" height="90" rx="2" fill="#ef4444"/>
  <text x="102" y="846" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Move on. Repeat for the next one.</text>
  <text x="102" y="874" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#555">This is how students find community right now.</text>

  <text x="72" y="1040" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff" opacity="0.3" letter-spacing="2">UNICIRCLE</text>
</svg>
