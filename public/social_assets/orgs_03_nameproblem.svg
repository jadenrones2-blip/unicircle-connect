<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <title>Orgs Carousel — Slide 3 The Name Problem</title>
  <rect width="1080" height="1080" fill="#0A0A0A"/>

  <rect x="1050" y="0" width="30" height="1080" fill="#C9A84C" fill-opacity="0.06"/>
  <text x="1068" y="548" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#C9A84C" fill-opacity="0.4" text-anchor="middle" transform="rotate(90,1068,548)" letter-spacing="3">SWIPE</text>

  <text x="80" y="88" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#C9A84C" letter-spacing="4">03 / 05</text>

  <!-- Eyebrow -->
  <text x="80" y="190" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ef4444" letter-spacing="5">THE WORST PART.</text>
  <rect x="80" y="204" width="60" height="2" fill="#ef4444"/>

  <!-- Scene setup -->
  <text x="80" y="320" font-family="'Arial Black', Arial, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-3">Someone shows</text>
  <text x="80" y="410" font-family="'Arial Black', Arial, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-3">up to your</text>
  <text x="80" y="500" font-family="'Arial Black', Arial, sans-serif" font-size="76" font-weight="900" fill="#C9A84C" letter-spacing="-3">info night.</text>

  <rect x="80" y="535" width="920" height="1" fill="#ffffff" opacity="0.07"/>

  <!-- The chain of failure -->
  <text x="80" y="620" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff">They applied 2 weeks ago.</text>
  <text x="80" y="664" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff">Their name is on a sign-in sheet.</text>
  <text x="80" y="708" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff">Their application is on row 147 of a spreadsheet.</text>

  <rect x="80" y="744" width="920" height="1" fill="#ffffff" opacity="0.07"/>

  <text x="80" y="830" font-family="'Arial Black', Arial, sans-serif" font-size="82" font-weight="900" fill="#ffffff" letter-spacing="-3">You have no</text>
  <text x="80" y="926" font-family="'Arial Black', Arial, sans-serif" font-size="82" font-weight="900" fill="#C9A84C" letter-spacing="-3">idea who they are.</text>

  <text x="80" y="1000" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#555">Every quarter. Every org. Nobody talks about it.</text>

  <text x="80" y="1048" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#C9A84C" letter-spacing="2" opacity="0.5">UNICIRCLE</text>
</svg>
