<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <title>UniCircle — 10 Minutes Here Will Ruin Spreadsheet Recruiting For You Forever</title>
  <desc>UniCircle social asset: The "brainwash" hook — once you see a real pipeline, you can't go back to Google Forms.</desc>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#0A0A0A"/>

  <!-- Subtle grid texture -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C9A84C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8C96B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fadeBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#0A0A0A;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#grid)"/>

  <!-- Gold top accent bar -->
  <rect x="0" y="0" width="1080" height="5" fill="url(#goldGrad)"/>

  <!-- Eyebrow label -->
  <rect x="80" y="88" width="200" height="2" fill="#C9A84C" opacity="0.6"/>
  <text x="80" y="78" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#C9A84C" letter-spacing="4" opacity="0.9">UNICIRCLE</text>

  <!-- Main headline — 3 lines, massive -->
  <text x="80" y="230" font-family="'Helvetica Neue', Arial, sans-serif" font-size="118" font-weight="900" fill="#FFFFFF" letter-spacing="-4">10</text>
  <text x="80" y="350" font-family="'Helvetica Neue', Arial, sans-serif" font-size="118" font-weight="900" fill="#FFFFFF" letter-spacing="-4">minutes</text>
  <text x="80" y="465" font-family="'Helvetica Neue', Arial, sans-serif" font-size="118" font-weight="900" fill="#C9A84C" letter-spacing="-4">here</text>

  <!-- Divider -->
  <rect x="80" y="505" width="920" height="1.5" fill="#ffffff" opacity="0.12"/>

  <!-- Sub-statement -->
  <text x="80" y="580" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" opacity="0.95">will ruin spreadsheet</text>
  <text x="80" y="650" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" opacity="0.95">recruiting for you</text>
  <text x="80" y="720" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" fill="#C9A84C">forever.</text>

  <!-- Context line -->
  <text x="80" y="820" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="400" fill="#71717a">Once you see a real pipeline, you can't</text>
  <text x="80" y="856" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="400" fill="#71717a">go back to a Google Form and a group chat.</text>

  <!-- Bottom CTA pill -->
  <rect x="80" y="940" width="340" height="64" rx="32" fill="#C9A84C"/>
  <text x="250" y="980" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#0A0A0A" text-anchor="middle" letter-spacing="1">unicircle.app</text>

  <!-- Corner watermark -->
  <text x="1000" y="980" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff" opacity="0.2" text-anchor="end">@unicircleapp</text>
</svg>
