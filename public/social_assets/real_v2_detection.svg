<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <title>Detection Box — UniCircle</title>

  <!-- Dark concrete background — aerial crosswalk feel -->
  <rect width="1080" height="1080" fill="#141414"/>

  <!-- Crosswalk stripes — aerial view -->
  <rect x="0" y="0" width="1080" height="1080" fill="#1a1a1a"/>
  <rect x="0" y="80" width="1080" height="60" fill="#222" opacity="0.6"/>
  <rect x="0" y="200" width="1080" height="60" fill="#222" opacity="0.6"/>
  <rect x="0" y="320" width="1080" height="60" fill="#222" opacity="0.6"/>
  <rect x="0" y="440" width="1080" height="60" fill="#222" opacity="0.6"/>
  <rect x="0" y="560" width="1080" height="60" fill="#222" opacity="0.6"/>
  <rect x="0" y="680" width="1080" height="60" fill="#222" opacity="0.6"/>
  <rect x="0" y="800" width="1080" height="60" fill="#222" opacity="0.6"/>
  <rect x="0" y="920" width="1080" height="60" fill="#222" opacity="0.6"/>

  <!-- Detection box 1 — top left -->
  <rect x="48" y="60" width="280" height="180" fill="none" stroke="#C9A84C" stroke-width="2"/>
  <rect x="48" y="60" width="14" height="3" fill="#C9A84C"/>
  <rect x="48" y="60" width="3" height="14" fill="#C9A84C"/>
  <rect x="312" y="60" width="14" height="3" fill="#C9A84C"/>
  <rect x="309" y="60" width="3" height="14" fill="#C9A84C"/>
  <rect x="48" y="237" width="14" height="3" fill="#C9A84C"/>
  <rect x="48" y="224" width="3" height="14" fill="#C9A84C"/>
  <rect x="312" y="237" width="14" height="3" fill="#C9A84C"/>
  <rect x="309" y="224" width="3" height="14" fill="#C9A84C"/>
  <rect x="48" y="48" width="240" height="26" fill="#C9A84C"/>
  <text x="56" y="67" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0A0A0A" letter-spacing="1">UNREAD APPLICATION · 87%</text>
  <text x="62" y="130" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#C9A84C" opacity="0.6">Submitted 3 weeks ago.</text>
  <text x="62" y="155" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#C9A84C" opacity="0.6">Never opened.</text>

  <!-- Detection box 2 — top right -->
  <rect x="720" y="40" width="320" height="200" fill="none" stroke="#C9A84C" stroke-width="2"/>
  <rect x="720" y="40" width="14" height="3" fill="#C9A84C"/>
  <rect x="720" y="40" width="3" height="14" fill="#C9A84C"/>
  <rect x="1034" y="40" width="14" height="3" fill="#C9A84C"/>
  <rect x="1031" y="40" width="3" height="14" fill="#C9A84C"/>
  <rect x="720" y="237" width="14" height="3" fill="#C9A84C"/>
  <rect x="720" y="224" width="3" height="14" fill="#C9A84C"/>
  <rect x="1034" y="237" width="14" height="3" fill="#C9A84C"/>
  <rect x="1031" y="224" width="3" height="14" fill="#C9A84C"/>
  <rect x="720" y="28" width="220" height="26" fill="#C9A84C"/>
  <text x="728" y="47" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0A0A0A" letter-spacing="1">SPREADSHEET ROW 247 · 99%</text>
  <text x="734" y="110" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#C9A84C" opacity="0.6">Copied manually from</text>
  <text x="734" y="132" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#C9A84C" opacity="0.6">Google Form response.</text>
  <text x="734" y="160" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#C9A84C" opacity="0.6">Officer hasn't looked at it.</text>

  <!-- Detection box 3 — center left -->
  <rect x="40" y="340" width="360" height="220" fill="none" stroke="#ef4444" stroke-width="2"/>
  <rect x="40" y="328" width="240" height="26" fill="#ef4444"/>
  <text x="48" y="347" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="1">2AM DELIBERATION · 100%</text>
  <text x="56" y="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#ef4444" opacity="0.8">"are we done yet"</text>
  <text x="56" y="424" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#555">1:47 AM</text>
  <text x="56" y="460" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#ef4444" opacity="0.8">"still on applicant 89"</text>
  <text x="56" y="484" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#555">1:52 AM</text>
  <text x="56" y="520" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#ef4444" opacity="0.8">"the sheet crashed again"</text>
  <text x="56" y="544" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#555">2:01 AM</text>

  <!-- Detection box 4 — center right -->
  <rect x="640" y="300" width="400" height="200" fill="none" stroke="#C9A84C" stroke-width="2"/>
  <rect x="640" y="288" width="260" height="26" fill="#C9A84C"/>
  <text x="648" y="307" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0A0A0A" letter-spacing="1">VENMO MISMATCH DETECTED · 94%</text>
  <text x="656" y="360" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#C9A84C" opacity="0.7">Alex C. → "Alex Chen?" or</text>
  <text x="656" y="384" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#C9A84C" opacity="0.7">"Alexander Chen?" or</text>
  <text x="656" y="408" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#C9A84C" opacity="0.7">"Alex C-something"?</text>
  <text x="656" y="444" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#555">Matching by hand. 300 names.</text>
  <text x="656" y="466" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#555">Every. Single. Quarter.</text>

  <!-- Detection box 5 — bottom left -->
  <rect x="40" y="680" width="320" height="160" fill="none" stroke="#C9A84C" stroke-width="2"/>
  <rect x="40" y="668" width="220" height="26" fill="#C9A84C"/>
  <text x="48" y="687" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0A0A0A" letter-spacing="1">INCONSISTENT SCORE · 91%</text>
  <text x="54" y="740" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#C9A84C" opacity="0.7">Officer A gave: 8/10</text>
  <text x="54" y="764" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#C9A84C" opacity="0.7">Officer B gave: 4/10</text>
  <text x="54" y="788" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#C9A84C" opacity="0.7">Officer C: didn't review yet</text>
  <text x="54" y="818" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#555">No rubric. No structure.</text>

  <!-- Detection box 6 — bottom right -->
  <rect x="660" y="640" width="380" height="180" fill="none" stroke="#ef4444" stroke-width="2"/>
  <rect x="660" y="628" width="200" height="26" fill="#ef4444"/>
  <text x="668" y="647" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="1">LOST APPLICANT · 88%</text>
  <text x="674" y="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#ef4444" opacity="0.8">Applied 4 weeks ago.</text>
  <text x="674" y="724" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#555">No confirmation email sent.</text>
  <text x="674" y="748" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#555">Buried in row 189.</text>
  <text x="674" y="780" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#ef4444" opacity="0.8">Probably a great candidate.</text>

  <!-- Bottom bar — the fix -->
  <rect x="0" y="890" width="1080" height="190" fill="#0A0A0A" opacity="0.92"/>
  <rect x="0" y="890" width="1080" height="3" fill="#C9A84C"/>

  <text x="54" y="950" font-family="'Arial Black', Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-2">This is what we</text>
  <text x="54" y="1010" font-family="'Arial Black', Arial, sans-serif" font-size="52" font-weight="900" fill="#C9A84C" letter-spacing="-2">came to fix.</text>

  <text x="900" y="970" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#C9A84C" text-anchor="middle">unicircle.app</text>
  <text x="900" y="998" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle">free for student orgs</text>
</svg>
