<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UniCircle × SIC — QR Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      gap: 24px;
    }

    /* ── Card ── */
    .card {
      width: 420px;
      background: #0A0A0A;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 44px 40px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      position: relative;
      overflow: hidden;
    }

    /* corner glows */
    .card::before {
      content: '';
      position: absolute;
      top: -80px; right: -80px;
      width: 220px; height: 220px;
      background: radial-gradient(circle, rgba(124,58,237,0.22) 0%, transparent 70%);
      pointer-events: none;
    }
    .card::after {
      content: '';
      position: absolute;
      bottom: -60px; left: -60px;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(196,150,28,0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    /* top accent */
    .accent-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #7C3AED, hsl(43,74%,56%), #7C3AED);
      border-radius: 28px 28px 0 0;
    }

    /* clubs row */
    .clubs {
      display: flex; align-items: center; gap: 10px;
      z-index: 1;
    }
    .chip {
      display: flex; align-items: center; gap-6px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 100px;
      padding: 5px 12px;
      gap: 6px;
    }
    .chip .dot { width: 6px; height: 6px; border-radius: 50%; }
    .chip span { font-size: 11px; font-weight: 600; color: #71717a; }
    .x { font-size: 12px; color: #3f3f46; font-weight: 700; }

    /* QR image */
    .qr-wrap {
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      z-index: 1;
    }
    .qr-wrap img { display: block; border-radius: 6px; }

    /* scan label */
    .scan-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #7C3AED;
      z-index: 1;
    }

    /* headline */
    .headline {
      text-align: center;
      z-index: 1;
    }
    .headline h2 {
      font-size: 22px;
      font-weight: 800;
      color: #f4f4f5;
      line-height: 1.15;
      margin-bottom: 6px;
    }
    .headline p {
      font-size: 13px;
      color: #52525b;
      line-height: 1.5;
    }

    /* url pill */
    .url-pill {
      background: rgba(124,58,237,0.1);
      border: 1px solid rgba(124,58,237,0.22);
      border-radius: 100px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 700;
      color: #A78BFA;
      letter-spacing: 0.04em;
      z-index: 1;
    }

    /* details row */
    .details {
      display: flex;
      gap: 10px;
      z-index: 1;
      width: 100%;
    }
    .detail {
      flex: 1;
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: center;
    }
    .detail .dl { font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #3f3f46; margin-bottom: 4px; }
    .detail .dv { font-size: 13px; font-weight: 700; color: #A78BFA; }
    .detail .ds { font-size: 10px; color: #52525b; margin-top: 2px; }

    /* ── Toolbar ── */
    .toolbar {
      display: flex; gap: 10px;
    }
    .tbtn {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px; font-weight: 700;
      border: none; cursor: pointer;
      border-radius: 100px;
      padding: 10px 22px;
      transition: opacity 0.15s;
    }
    .tbtn:hover { opacity: 0.8; }
    .tbtn-png { background: #7C3AED; color: #fff; }
    .tbtn-print { background: rgba(255,255,255,0.06); color: #a1a1aa; border: 1px solid rgba(255,255,255,0.1); }

    @media print {
      body { background: #fff; justify-content: flex-start; padding: 0; gap: 0; }
      .toolbar { display: none; }
      .card { border: none; box-shadow: none; }
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <div class="accent-bar"></div>

    <!-- Club chips -->
    <div class="clubs">
      <div class="chip">
        <div class="dot" style="background:#A78BFA"></div>
        <span>Startup Incubator Club</span>
      </div>
      <span class="x">×</span>
      <div class="chip">
        <div class="dot" style="background:hsl(43,74%,56%)"></div>
        <span>UniCircle</span>
      </div>
    </div>

    <!-- QR code (white bg for max scannability) -->
    <div class="qr-wrap">
      <img
        src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=https%3A%2F%2Funicircle.app%2Ftabling&format=png&margin=0"
        width="200" height="200"
        alt="QR code — unicircle.app/tabling"
      />
    </div>

    <span class="scan-label">Scan to get started</span>

    <!-- Headline -->
    <div class="headline">
      <h2>The campus is unfinished.<br/>Let's build it.</h2>
      <p>Create your UniCircle account &amp; claim<br/>your free Lovable AI credits.</p>
    </div>

    <!-- URL pill -->
    <div class="url-pill">unicircle.app/tabling</div>

    <!-- Event details -->
    <div class="details">
      <div class="detail">
        <div class="dl">Day</div>
        <div class="dv">Wednesday</div>
        <div class="ds">May 14, 2026</div>
      </div>
      <div class="detail">
        <div class="dl">Time</div>
        <div class="dv">2:00 PM</div>
        <div class="ds">Come anytime</div>
      </div>
      <div class="detail">
        <div class="dl">Where</div>
        <div class="dv">Library Walk</div>
        <div class="ds">UCSD</div>
      </div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar" id="toolbar">
    <button class="tbtn tbtn-print" onclick="printCard()">Print</button>
    <button class="tbtn tbtn-png" id="dlBtn" onclick="downloadPNG()">⬇ Download PNG</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    async function downloadPNG() {
      const btn = document.getElementById('dlBtn');
      btn.textContent = 'Capturing…';

      const canvas = await html2canvas(document.getElementById('card'), {
        scale: 3,
        useCORS: true,
        backgroundColor: '#0A0A0A',
      });

      const link = document.createElement('a');
      link.download = 'unicircle-sic-qr.png';
      link.href = canvas.toDataURL('image/png');
      link.click();

      btn.textContent = '⬇ Download PNG';
    }

    function printCard() {
      window.print();
    }
  </script>

</body>
</html>
